name: vidra
description: "Vidra - Video Streaming App"
publish_to: "none"
version: 1.11.4+33

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  # Reads the real version off the bundle for the rail's footer — already in
  # the lock file as a transitive dep, so declaring it costs nothing.
  package_info_plus: ^10.2.1

  flutter_riverpod: ^3.3.1
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1
  go_router: ^17.0.1
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  vidra_player:
    git:
      url: https://github.com/heyvidra/VidraPlayer.git
      # v1.4.7 (sweep waits out short pauses, low-core machines sweep at 8x);
      # pinned to the commit so it unifies with vidra_player_kit's internal
      # `vidra_player: path: ../../` dep (pub won't match a tag to a commit).
      ref: 221c55a612a3b09cf036a835b7ccf21e2e98de29

  vidra_player_kit:
    git:
      url: https://github.com/heyvidra/VidraPlayer.git
      path: packages/vidra_player_fvp
      ref: v1.4.7

  # Diagnostics. The DSN is never in this repo — it arrives as a
  # --dart-define, and an empty one makes every call here a no-op, so a dev
  # build reports nothing and a fork of this repo cannot report to us.
  sentry_flutter: ^9.27.0

  dio: ^5.9.2
  ffi: ^2.1.0
  crypto: ^3.0.7
  shimmer_animation: ^2.2.2+1
  uuid: ^4.5.1
  wakelock_plus: ^1.5.1
  file_picker: ^12.0.0-beta.5
  bitsdojo_window:
    git:
      url: https://github.com/heyvidra/bitsdojo_window_plus.git
      path: bitsdojo_window
      # v0.4.2: traffic lights are no longer clipped to half their height on
      # macOS 13 and older — the taller-than-standard titlebar centres them
      # past NSTitlebarView's bounds, and only macOS 14+ leaves overflow
      # unclipped. (0.4.1: the hide-on-startup latch; 0.4.0: window
      # lifecycle by name.)
      ref: v0.4.2

  # git, not path: this repo is developed from worktrees as well as from its
  # own checkout, and a relative path resolves differently in each.
  vidra_cast:
    git:
      url: https://github.com/heyvidra/vidra_cast.git
      ref: v0.1.8

  path: ^1.9.1
  easy_localization: ^3.0.8
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.6.0+eol
  local_notifier: ^0.1.6

# fvp 0.36+ regression (upstream commit 6a2d588): event plumbing moved from
# native callbacks to Dart streams, but MdkVideoPlayer.dispose() closes
# streamCtl without cancelling the listeners -> queued events throw
# "Bad state: Cannot add event after closing" when the player window closes.
# ../fvp is a vendored 0.37.3 with the subscriptions cancelled in dispose()
# (see PATCH(vidra) markers). Drop this override once fixed upstream.
dependency_overrides:
  fvp:
    git:
      url: https://github.com/heyvidra/fvp.git
dev_dependencies:
  flutter_lints: ^6.0.0

  # Uploads the debug symbols that --split-debug-info strips out of the
  # release build. Without it every reported stack trace is a list of
  # addresses. CI-only: run by the release workflow, never at build time.
  sentry_dart_plugin: ^3.3.0

  build_runner: ^2.12.2
  drift_dev: ^2.30.1

  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - assets/certs/
    # Desktop pet spritesheet: a 288x64 horizontal strip of six 48x64 cells
    # (idle | walk1 | walk2 | jump | wink | blink), sliced from the character
    # design sheet by test/spritesheet_extractor_test.dart (PET_SHEET=... to
    # regenerate; blink is derived from the idle cell).
    - assets/pixel_cat_spritesheet.png

# Debug-symbol upload for release builds (see sentry_dart_plugin in
# dev_dependencies). Reads SENTRY_AUTH_TOKEN from the environment; the release
# workflow skips the whole step when that secret is absent.
sentry:
  upload_debug_symbols: true
  upload_source_maps: false
  project: flutter
  org: vidra
  # Must match --split-debug-info in the release workflow. The plugin defaults
  # this to '.', which finds nothing and uploads nothing — a green CI step
  # that shipped no symbols is worse than a failed one.
  symbols_path: debug-info
  # EU-region org: sentry-cli defaults to the US endpoint and the upload would
  # 404 against it. The DSN carries its own region, so only this side needs it.
  url: https://de.sentry.io
  # No `release:` on purpose. The plugin derives `name@version+buildNumber`
  # from the pubspec above, which is exactly what Telemetry sends at runtime —
  # pinning it here would be a second copy of the version to forget to bump,
  # and symbols under the wrong release symbolicate nothing.
