name: vidra
description: "Vidra - Video Streaming App"
publish_to: "none"
version: 1.7.1+24

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  # Reads the real version off the bundle for the rail's footer — already in
  # the lock file as a transitive dep, so declaring it costs nothing.
  package_info_plus: ^10.2.1

  flutter_riverpod: ^3.3.1
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1
  go_router: ^17.0.1
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  vidra_player:
    git:
      url: https://github.com/heyvidra/VidraPlayer.git
      # v1.4.6; pinned to the commit so it unifies with vidra_player_kit's
      # internal `vidra_player: path: ../../` dep (pub won't match a tag to a commit).
      ref: 7f04513ad07bf2e59a54f613585b520c519f0802

  vidra_player_kit:
    git:
      url: https://github.com/heyvidra/VidraPlayer.git
      path: packages/vidra_player_fvp
      ref: v1.4.6

  dio: ^5.9.2
  ffi: ^2.1.0
  crypto: ^3.0.7
  shimmer_animation: ^2.2.2+1
  uuid: ^4.5.1
  wakelock_plus: ^1.5.1
  file_picker: ^12.0.0-beta.5
  bitsdojo_window:
    git:
      url: https://github.com/heyvidra/bitsdojo_window_plus.git
      path: bitsdojo_window
      ref: v1.2.2

  path: ^1.9.1
  easy_localization: ^3.0.8
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.6.0+eol
  local_notifier: ^0.1.6

# fvp 0.36+ regression (upstream commit 6a2d588): event plumbing moved from
# native callbacks to Dart streams, but MdkVideoPlayer.dispose() closes
# streamCtl without cancelling the listeners -> queued events throw
# "Bad state: Cannot add event after closing" when the player window closes.
# ../fvp is a vendored 0.37.3 with the subscriptions cancelled in dispose()
# (see PATCH(vidra) markers). Drop this override once fixed upstream.
dependency_overrides:
  fvp:
    git:
      url: https://github.com/heyvidra/fvp.git
dev_dependencies:
  flutter_lints: ^6.0.0

  build_runner: ^2.12.2
  drift_dev: ^2.30.1

  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - assets/certs/
