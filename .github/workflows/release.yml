name: Release

on:
  push:
    tags:
      - "v*"
  # Dry run: builds and uploads the artifacts, creates no GitHub Release.
  # GitHub only offers "Run workflow" for a definition on the default
  # branch, so this trigger has to live here even while the build it
  # exercises is on a feature branch.
  workflow_dispatch:
    inputs:
      version:
        description: "MSI ProductVersion to build with (x.y.z)"
        default: "0.0.0"

# One place for the toolchain version.
# Must match the SDK the app is developed and tested on. 1.11.0 shipped a
# macOS build whose desktop pet window stayed invisible (window created,
# alpha never restored) — built by CI on 3.44.4 while every dev test ran on
# 3.47.0. The same code built locally on 3.47.0 releases correctly.
#
# NO actions/cache STEPS IN THIS FILE, deliberately. This workflow runs on
# tag pushes, and a cache saved under one tag's ref is invisible to every
# other tag (restore scope = current ref + default branch). Each release
# therefore ran cold while dutifully saving ~4.5 GiB per platform it could
# never read back — duplicated once more by flutter-action's cache:true —
# churning the 10 GiB quota for zero hits. Removing them changes build time
# not at all; it merely stops pretending. If release time ever matters,
# warm caches from a job on main (that scope IS readable from tags), don't
# re-add caching here.
env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  # Tag builds publish straight into a DRAFT Release instead of passing the
  # installers through workflow artifacts: the account's artifact storage
  # quota filled up and upload-artifact refused every file (1.16.7), with
  # both installers already built. Created here, once, because two build
  # jobs racing to create it would each get their own draft — drafts do not
  # claim the tag. The draft is invisible to users until the last job
  # publishes it, so a half-built release never shows.
  draft:
    name: Open draft release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
          || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
               --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""

  windows:
    name: Windows MSI
    # `draft` is skipped on a manual run; that must not skip the build.
    needs: draft
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: dart analyze

      - name: Test
        run: flutter test

      - name: Fetch vidraDlp native lib (media_ffi.dll)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VIDRADLP_TOKEN }}
        run: |
          set -e
          # Resolve the newest release rather than pinning. This was stuck on
          # v0.0.1 while the library shipped v0.4.3, so every build carried the
          # very first artifact ever cut — including, latterly, an FFI that
          # could not return rc=5 and took the app down on a parse panic.
          #
          # Unpinning trades reproducibility for freshness, so the resolved tag
          # is echoed and written to the step summary: an unpinned build must at
          # least be able to answer which library it contains.
          TAG="$(cat ENGINE_VERSION)"
          # Pinned via the ENGINE_VERSION file — fetching "latest" raced the
          # engine's own release pipeline and silently shipped the previous
          # engine when the app tag landed first. A missing pinned release
          # now fails loudly instead.
          echo "vidraDlp release: $TAG"
          echo "vidraDlp: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          gh release download "$TAG" -R heyvidra/VidraDlp \
            -p 'vidradlp-full-*_nt-*x86_64.tar.gz' -O vidradlp.tar.gz
          mkdir -p _vidradlp && tar -xzf vidradlp.tar.gz -C _vidradlp
          cp "$(find _vidradlp -name media_ffi.dll | head -1)" windows/media_ffi.dll
          ls -l windows/media_ffi.dll

      - name: Flutter Build (Windows Release)
        run: .\tool\build_windows.bat

      # `flutter build windows` reports "Unable to generate build files" and
      # swallows the CMake output that says WHY, so a configure failure arrives
      # as a sentence with no cause attached. These are the files that hold the
      # actual error; printing them on failure costs nothing and turns a
      # guessing game into a diagnosis.
      - name: CMake logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          $base = "build\windows\x64"
          foreach ($f in @("CMakeFiles\CMakeError.log",
                           "CMakeFiles\CMakeOutput.log",
                           "CMakeCache.txt")) {
            $p = Join-Path $base $f
            Write-Host "===== $p ====="
            if (Test-Path $p) { Get-Content $p -Tail 200 }
            else { Write-Host "(absent)" }
          }
          Write-Host "===== re-running configure verbosely ====="
          flutter build windows --release --verbose 2>&1 |
            Select-Object -Last 120

      # build_windows.bat appends pubspec_fonts.yaml to pubspec.yaml and strips
      # it again afterwards, so nothing downstream can tell whether the fonts
      # actually made it in. Without them Windows has no bundled CJK face and
      # every Chinese glyph falls back — check rather than ship that.
      - name: Verify bundled fonts
        shell: pwsh
        run: |
          $fonts = "build\windows\x64\runner\Release\data\flutter_assets\assets\fonts"
          $expected = (Select-String -Path pubspec_fonts.yaml -Pattern 'asset:').Count
          $found = @(Get-ChildItem -Path $fonts -Recurse -Filter *.ttf -ErrorAction SilentlyContinue)
          Write-Host "Bundled $($found.Count) of $expected font files"
          if ($found.Count -ne $expected) {
            Get-ChildItem -Path "build\windows\x64\runner\Release\data\flutter_assets" -ErrorAction SilentlyContinue
            throw "pubspec_fonts.yaml was not applied: expected $expected .ttf files under $fonts"
          }
          $manifest = "build\windows\x64\runner\Release\data\flutter_assets\FontManifest.json"
          if (-not (Select-String -Path $manifest -Pattern 'HarmonyOSSans_SC' -Quiet)) {
            throw "FontManifest.json is missing the HarmonyOSSans_SC family"
          }

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Generate WiX files with heat
        shell: pwsh
        run: |
          cd installer
          heat dir ..\build\windows\x64\runner\Release `
            -platform x64 `
            -cg VidraFiles `
            -dr INSTALLFOLDER `
            -gg -srd -sfrag -sreg `
            -var var.SourceDir `
            -out files.wxs

      - name: Build MSI
        shell: pwsh
        run: |
          $sourceDir = Resolve-Path "build\windows\x64\runner\Release"

          # MajorUpgrade only replaces the installed build when ProductVersion
          # changes, so it has to come from the tag rather than a literal.
          $version = "${{ inputs.version || github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "'$version' is not a x.y.z version MSI can use"
          }
          Write-Host "Building MSI for version $version"

          # Ensure installer directory exists
          New-Item -ItemType Directory -Force -Path installer | Out-Null

          # Run candle
          candle `
            -dSourceDir="$sourceDir" `
            -dProductVersion="$version" `
            -arch x64 `
            -out installer\ `
            installer\vidra.wxs installer\files.wxs installer\CustomUI.wxs

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Candle compilation failed"
            exit $LASTEXITCODE
          }

          # Run light
          # -b installer: icon.ico / *.bmp / License.rtf are referenced relative
          # to the .wxs files, and light binds from the working directory.
          light `
            -ext WixUtilExtension `
            -b installer `
            -cultures:en-US `
            -spdb `
            -sice:ICE60 `
            -out Vidra-Windows-x64.msi `
            installer\vidra.wixobj installer\files.wixobj installer\CustomUI.wixobj

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Light linking failed"
            exit $LASTEXITCODE
          }

      - name: Attach to draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Vidra-Windows-x64.msi --clobber -R "$GITHUB_REPOSITORY"

      - name: Upload MSI Artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Vidra-Windows-x64-MSI
          path: Vidra-Windows-x64.msi
          # Only the release job downloads these, and it runs minutes
          # later; keeping them longer just eats the storage quota.
          retention-days: 7

  macos:
    name: macOS DMG
    # `draft` is skipped on a manual run; that must not skip the build.
    needs: draft
    if: ${{ !cancelled() && !failure() }}
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      # The dev machine builds with SwiftPM OFF (CocoaPods integration) —
      # `flutter config --list` there says enable-swift-package-manager:
      # false — so that is the only plugin-linking model any dev build or
      # test has ever exercised. Flutter defaults SwiftPM ON since 3.44,
      # so CI silently shipped a different binary shape: plugins in one
      # aggregate SwiftPM dylib, bitsdojo statically inside the main
      # executable. Those binaries lose the pet window's startup race that
      # CocoaPods-shaped binaries never lose (1.11.0-1.11.2 all invisible).
      # Match the tested configuration. Revisit when dev moves to SwiftPM.
      - name: Match dev plugin integration (CocoaPods, not SwiftPM)
        run: flutter config --no-enable-swift-package-manager

      - name: Get Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: dart analyze

      - name: Test
        run: flutter test

      - name: Fetch vidraDlp native lib (libmedia_ffi.dylib)
        env:
          GH_TOKEN: ${{ secrets.VIDRADLP_TOKEN }}
        run: |
          set -e
          # Newest release, not a pin — see the Windows job for why, and for
          # what the echoed tag is protecting against.
          TAG="$(cat ENGINE_VERSION)"
          # Pinned via the ENGINE_VERSION file — fetching "latest" raced the
          # engine's own release pipeline and silently shipped the previous
          # engine when the app tag landed first. A missing pinned release
          # now fails loudly instead.
          echo "vidraDlp release: $TAG"
          echo "vidraDlp: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          # Every darwin asset, not the first one that sorts. The old glob
          # took `find … | head -1` out of whatever it happened to download,
          # and what shipped in 1.12.0 was an arm64-ONLY libmedia_ffi.dylib
          # inside an otherwise universal app — so on an Intel Mac the
          # download engine could not load at all. Nothing caught it because
          # the step ended in `file`, which prints and never fails.
          rm -rf _dl _vidradlp && mkdir -p _dl _vidradlp
          gh release download "$TAG" -R heyvidra/VidraDlp \
            -p 'vidradlp-full-*darwin*.tar.gz' --dir _dl
          echo "downloaded:"; ls -1 _dl
          for t in _dl/*.tar.gz; do
            d="_vidradlp/$(basename "$t" .tar.gz)"
            mkdir -p "$d" && tar -xzf "$t" -C "$d"
          done
          # One universal dylib out of however many single-arch ones the
          # release publishes; lipo -create is a no-op on a single input that
          # is already fat.
          # An explicit array, not word-splitting on `$(find …)`: macOS ships
          # bash 3.2 (no mapfile), and splitting behaves differently again in
          # the zsh this is developed under, which is how the first draft of
          # this passed every eyeball and handed lipo one filename containing
          # a newline.
          libs=()
          while IFS= read -r l; do libs+=("$l"); done < <(
            find _vidradlp -name libmedia_ffi.dylib
          )
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "::error::no libmedia_ffi.dylib in any darwin asset of $TAG"
            exit 1
          fi
          for l in "${libs[@]}"; do echo "  $l: $(lipo -info "$l")"; done
          lipo -create "${libs[@]}" -output macos/libmedia_ffi.dylib
          # lipo writes a fresh Mach-O and the code signature does not come
          # with it. The slices arrive `adhoc, linker-signed` — the arm64
          # linker signs automatically — so before this merge the dylib was
          # always signed by accident, and after it Xcode's own CodeSign
          # phase refused the whole app with "code object is not signed at
          # all". Sign it here, where the merge happened.
          codesign --force --sign - macos/libmedia_ffi.dylib
          codesign --verify macos/libmedia_ffi.dylib
          # The app is universal, so this must be too. Failing here is the
          # point: a missing slice is invisible until an Intel user opens the
          # app and the download engine is simply gone.
          for arch in x86_64 arm64; do
            if ! lipo -info macos/libmedia_ffi.dylib | grep -q "$arch"; then
              echo "::error::libmedia_ffi.dylib has no $arch slice — $TAG ships" \
                   "$(lipo -info macos/libmedia_ffi.dylib)"
              exit 1
            fi
          done
          echo "libmedia_ffi: $(lipo -info macos/libmedia_ffi.dylib)"

      - name: Flutter Build (macOS Release)
        # The DSN lives in repo secrets, never in the tree: a build without one
        # reports nothing at all, which is what every fork and local build
        # should do. --split-debug-info means the traces that DO arrive carry
        # addresses, so the symbol upload below is what makes them readable.
        run: |
          flutter build macos --release --split-debug-info=debug-info \
            --dart-define=SENTRY_DSN="${SENTRY_DSN}"
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Verify bundled libmdk
        # macos/Podfile pins mdk to the v0.38.0 RELEASE artifact by checksum,
        # because every published mdk podspec points at one MUTABLE nightly
        # tarball: 1.16.6 shipped a 0.38.0 nightly (git d42eb07) while
        # Podfile.lock said 0.36.0 and every dev machine ran 0.37.0. That
        # nightly is what crashed — it carries the unreleased per-layer texture
        # refactor owning MetalVideo::Private::LayerTextures, which aborts the
        # process with `MTLTextureDescriptor has invalid pixelFormat (0)` after
        # a failed VideoToolbox session restart (Sentry FLUTTER-K).
        #
        # Podfile.lock still reads `mdk (0.36.0)` — the label is decorative, so
        # the lockfile CANNOT enforce this. Only these two assertions can.
        # Deliberately changing the pin? Update the expected hash below.
        run: |
          MDK=build/macos/Build/Products/Release/Vidra.app/Contents/Frameworks/mdk.framework/Versions/A/mdk
          if [ ! -f "$MDK" ]; then
            echo "::error::mdk.framework missing from the built app at $MDK"
            exit 1
          fi
          VER=$(strings -a "$MDK" | grep -m1 -E '\(git [0-9a-f]{7}\)' || true)
          echo "libmdk: $VER"
          if ! printf '%s' "$VER" | grep -q 'git b43ab43'; then
            echo "::error::libmdk is not the pinned v0.38.0 release (expected git b43ab43): $VER"
            exit 1
          fi
          # The regression guard proper: this symbol exists only in the
          # post-0.38.0 nightlies that carry the crashing refactor.
          if [ "$(strings -a "$MDK" | grep -c ensureLayerTextures)" != "0" ]; then
            echo "::error::libmdk contains the per-layer texture code that aborts" \
                 "in MetalVideo::LayerTextures — a nightly leaked back in: $VER"
            exit 1
          fi

      - name: Upload debug symbols to Sentry
        # Skipped rather than failed when the token is absent: a fork building
        # this tag must still get a DMG. The `secrets` context is NOT readable
        # from a step-level `if:` — GitHub silently evaluates it to empty, so
        # the condition would be false forever and this step would never run.
        # Hoisting it into `env` at the step is what makes it visible.
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        run: dart run sentry_dart_plugin
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Install create-dmg
        run: brew install create-dmg

      # One universal build, split into two downloads.
      #
      # Flutter builds macOS universal, so every user was downloading a
      # complete copy of the architecture their Mac cannot run: 96 MB
      # installed, 61 MB once thinned. Thinning here rather than building
      # twice keeps one compile and one symbol upload, and the two bundles
      # are byte-identical to the slices that were tested together.
      #
      # Re-signing is not optional. The bundle is ad-hoc signed, lipo
      # invalidates that, and macOS refuses to launch an unsigned arm64
      # binary at all — the failure is a crash on open, not a warning.
      - name: Create DMGs (per architecture)
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            slice=$arch
            [ "$arch" = "x64" ] && slice=x86_64
            rm -rf "dmg-$arch" && mkdir "dmg-$arch"
            cp -R build/macos/Build/Products/Release/Vidra.app "dmg-$arch/"
            app="dmg-$arch/Vidra.app"
            # Every Mach-O, not just the executables: the frameworks are
            # where the weight is, and a .dylib is not marked executable.
            find "$app" -type f | while read -r f; do
              if lipo -info "$f" 2>/dev/null | grep -q '^Architectures in the fat file'; then
                lipo -thin "$slice" "$f" -output "$f.thin" && mv "$f.thin" "$f"
              fi
            done
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            echo "$arch: $(du -sh "$app" | cut -f1)"
            create-dmg \
              --volname "Vidra" \
              --window-size 500 300 \
              --icon-size 100 \
              --app-drop-link 350 150 \
              "Vidra-macOS-$arch.dmg" \
              "dmg-$arch"
          done

      - name: Attach to draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Vidra-macOS-*.dmg --clobber -R "$GITHUB_REPOSITORY"

      - name: Upload DMG Artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Vidra-macOS-DMG
          path: Vidra-macOS-*.dmg
          # Only the release job downloads these, and it runs minutes
          # later; keeping them longer just eats the storage quota.
          retention-days: 7

  # Android TV. Its own job on its own runner, and deliberately NOT something
  # the desktop release waits on to succeed: an Android toolchain hiccup must
  # not hold back the Windows and macOS installers (the engine's pipeline
  # learned this the hard way). See the `release` job's `if`.
  android_tv:
    name: Android TV APK
    # `draft` is skipped on a manual run; that must not skip the build.
    needs: draft
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get Dependencies
        run: flutter pub get

      # Analysis and tests already ran twice, on the desktop jobs, against
      # this same tree. No vidraDlp fetch either: the TV build has no
      # downloads, so nothing in it loads the engine.

      # Android installs an update only over a build signed by the same key.
      # Without the secret the APK is signed by this runner's throwaway debug
      # key — it installs, but the NEXT release will refuse to install over it
      # until the user uninstalls. So a missing key is loud, and on a tag it
      # is fatal: a release nobody can update from is worse than no release.
      #
      # `secrets` is not readable from a step-level `if:` (see the Sentry step
      # in the macOS job), hence the hoist into env.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to release a debug-signed APK"
              exit 1
            fi
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — this dry-run APK is debug-signed"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vidra-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vidra-release.jks" >> "$GITHUB_ENV"

      - name: Flutter Build (Android TV Release)
        # Both ABIs in one APK: TV boxes are still commonly 32-bit, and a
        # sideloaded file has no store to pick the right split for the user.
        run: flutter build apk --release --target-platform android-arm,android-arm64
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK
        # The two things that make it a TV app and not a phone app that
        # happens to install: the leanback launcher entry (without it the app
        # has no icon on a TV home screen) and both ABIs actually inside.
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk Vidra-AndroidTV.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt2" dump badging Vidra-AndroidTV.apk > badging.txt
          grep -E "^package:|leanback|native-code" badging.txt
          grep -q "leanback-launchable-activity" badging.txt \
            || { echo "::error::no LEANBACK_LAUNCHER activity in the APK"; exit 1; }
          for abi in armeabi-v7a arm64-v8a; do
            grep "native-code" badging.txt | grep -q "$abi" \
              || { echo "::error::APK has no $abi libraries"; exit 1; }
          done
          "$BT/apksigner" verify --print-certs Vidra-AndroidTV.apk | grep -E "DN|SHA-256"
          ls -lh Vidra-AndroidTV.apk

      - name: Attach to draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Vidra-AndroidTV.apk --clobber -R "$GITHUB_REPOSITORY"

      - name: Upload APK Artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Vidra-AndroidTV-APK
          path: Vidra-AndroidTV.apk
          retention-days: 7

  # ============ 🎉 创建 GitHub Release ============
  release:
    name: Create GitHub Release
    # Waits for android_tv so the APK is attached before the draft goes
    # public, but does not REQUIRE it: `always()` lifts the implicit
    # "every need succeeded", and the two desktop results are then checked by
    # hand. A failed TV build ships a release without the APK row below.
    needs: [windows, macos, android_tv]
    # A manual run is a dry run: the artifacts are worth having, a Release is not.
    if: >-
      ${{ always() && startsWith(github.ref, 'refs/tags/v')
          && needs.windows.result == 'success'
          && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Tags and history, because the notes step derives the PREVIOUS tag
          # with `git describe` to build a compare link. The default shallow
          # checkout has neither, and the fallback would silently degrade to
          # linking every commit reachable from this tag.
          fetch-depth: 0

      # 提取版本号
      - name: Get Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # 生成 Release Notes
      #
      # 每版专属的部分 — 更新了什么、升级要注意什么、已知问题 — 来自仓库里的
      # release_notes/<版本>.md。写在提交里,跟着 tag 走,发版前就能review;
      # 写在这个 heredoc 里的话,改一次说明就要改一次 workflow。
      #
      # 缺这个文件时退回提交对比链接,而不是一句"bug 修复与性能改进":那句话
      # 每版都成立,所以每版都没有信息,而这个项目的说明本来就写在提交里。忘了
      # 写说明不该让一次发版失败,但也不该让 Release 正文假装说了点什么。
      # 下载表和安装说明留在这里,它们每版都一样。
      - name: Generate Release Notes
        id: notes
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          cat > release_notes.md << 'EOF'
          ## 🎉 Vidra ${{ steps.version.outputs.version }}

          ### 📦 Downloads

          | Platform | File |
          |---|---|
          | **Windows (64-bit)** | `Vidra-Windows-x64.msi` |
          | **macOS — Apple 芯片 (M1/M2/M3/M4)** | `Vidra-macOS-arm64.dmg` |
          | **macOS — Intel 芯片** | `Vidra-macOS-x64.dmg` |
          ${{ needs.android_tv.result == 'success' && '| **Android TV / 电视盒子** | `Vidra-AndroidTV.apk` |' || '' }}

          EOF

          if [ -f "release_notes/${VERSION}.md" ]; then
            echo "Using release_notes/${VERSION}.md"
            cat "release_notes/${VERSION}.md" >> release_notes.md
          else
            echo "::notice::no release_notes/${VERSION}.md — linking the commit range"
            PREV="$(git describe --tags --abbrev=0 "v${VERSION}^" 2>/dev/null || true)"
            {
              echo "### 变更"
              echo
              if [ -n "$PREV" ]; then
                echo "[\`$PREV...v${VERSION}\`](https://github.com/${GITHUB_REPOSITORY}/compare/$PREV...v${VERSION})"
              else
                echo "[\`v${VERSION}\`](https://github.com/${GITHUB_REPOSITORY}/commits/v${VERSION})"
              fi
            } >> release_notes.md
          fi

          cat >> release_notes.md << 'EOF'

          ### 📝 Installation

          **Windows:**
          1. Download `Vidra-Windows-x64.msi`
          2. Double-click to install
          3. Follow the installation wizard

          **macOS:** 先看左上角  → 关于本机。写着 Apple M 系列就选 `arm64`,
          写着 Intel 就选 `x64`。
          1. Download the DMG for your chip
          2. Open the DMG file
          3. Drag Vidra.app to Applications folder

          拿错了不会损坏任何东西: Intel 机器打开 arm64 版会直接报"不支持",
          Apple 芯片打开 x64 版能跑但走 Rosetta 转译,会明显更慢。

          **Android TV / 电视盒子:** 把 `Vidra-AndroidTV.apk` 拷到 U 盘用电视的文件管理器安装,
          或 `adb install -r Vidra-AndroidTV.apk`。需要在电视设置里允许安装未知来源应用。

          ### 💬 Feedback

          Please report issues on [GitHub Issues](https://github.com/${{ github.repository }}/issues)
          EOF

          echo "--- generated ---"
          cat release_notes.md

      # 发布草稿:安装包已经由各构建任务挂上去了
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --draft=false --title "Vidra ${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md
