name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Windows MSI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============ Flutter 缓存 ============
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: C:\hostedtoolcache\windows\flutter
          key: flutter-windows-${{ runner.os }}-3.38.5
          restore-keys: flutter-windows-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
            .dart_tool
            .packages
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: dart analyze

      - name: Test
        run: flutter test

      - name: Cache Build Output
        uses: actions/cache@v4
        with:
          path: build\windows\x64\runner\Release
          # assets/** and pubspec_fonts.yaml belong in the key: they are what
          # ends up in flutter_assets, so a font or image change has to miss.
          key: build-windows-${{ runner.os }}-${{ hashFiles('lib/**', 'windows/**', 'assets/**', 'pubspec.yaml', 'pubspec_fonts.yaml', 'tool/**') }}
          restore-keys: build-windows-${{ runner.os }}-

      - name: Fetch vidraDlp native lib (media_ffi.dll)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VIDRADLP_TOKEN }}
        run: |
          set -e
          gh release download v0.0.1 -R heyvidra/VidraDlp \
            -p 'vidradlp-full-*_nt-*x86_64.tar.gz' -O vidradlp.tar.gz
          mkdir -p _vidradlp && tar -xzf vidradlp.tar.gz -C _vidradlp
          cp "$(find _vidradlp -name media_ffi.dll | head -1)" windows/media_ffi.dll
          ls -l windows/media_ffi.dll

      - name: Flutter Build (Windows Release)
        run: .\tool\build_windows.bat

      # build_windows.bat appends pubspec_fonts.yaml to pubspec.yaml and strips
      # it again afterwards, so nothing downstream can tell whether the fonts
      # actually made it in. Without them Windows has no bundled CJK face and
      # every Chinese glyph falls back — check rather than ship that.
      - name: Verify bundled fonts
        shell: pwsh
        run: |
          $fonts = "build\windows\x64\runner\Release\data\flutter_assets\assets\fonts"
          $expected = (Select-String -Path pubspec_fonts.yaml -Pattern 'asset:').Count
          $found = @(Get-ChildItem -Path $fonts -Recurse -Filter *.ttf -ErrorAction SilentlyContinue)
          Write-Host "Bundled $($found.Count) of $expected font files"
          if ($found.Count -ne $expected) {
            Get-ChildItem -Path "build\windows\x64\runner\Release\data\flutter_assets" -ErrorAction SilentlyContinue
            throw "pubspec_fonts.yaml was not applied: expected $expected .ttf files under $fonts"
          }
          $manifest = "build\windows\x64\runner\Release\data\flutter_assets\FontManifest.json"
          if (-not (Select-String -Path $manifest -Pattern 'HarmonyOSSans_SC' -Quiet)) {
            throw "FontManifest.json is missing the HarmonyOSSans_SC family"
          }

      - name: Cache WiX Toolset
        id: cache-wix
        uses: actions/cache@v4
        with:
          path: C:\ProgramData\chocolatey\lib\wixtoolset
          key: wix-toolset-3.14

      - name: Install WiX Toolset
        if: steps.cache-wix.outputs.cache-hit != 'true'
        run: choco install wixtoolset -y

      - name: Generate WiX files with heat
        shell: pwsh
        run: |
          cd installer
          heat dir ..\build\windows\x64\runner\Release `
            -platform x64 `
            -cg VidraFiles `
            -dr INSTALLFOLDER `
            -gg -srd -sfrag -sreg `
            -var var.SourceDir `
            -out files.wxs

      - name: Build MSI
        shell: pwsh
        run: |
          $sourceDir = Resolve-Path "build\windows\x64\runner\Release"

          # MajorUpgrade only replaces the installed build when ProductVersion
          # changes, so it has to come from the tag rather than a literal.
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '${{ github.ref_name }}' is not a x.y.z version MSI can use"
          }
          Write-Host "Building MSI for version $version"

          # Ensure installer directory exists
          New-Item -ItemType Directory -Force -Path installer | Out-Null

          # Run candle
          candle `
            -dSourceDir="$sourceDir" `
            -dProductVersion="$version" `
            -arch x64 `
            -out installer\ `
            installer\vidra.wxs installer\files.wxs installer\CustomUI.wxs

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Candle compilation failed"
            exit $LASTEXITCODE
          }

          # Run light
          # -b installer: icon.ico / *.bmp / License.rtf are referenced relative
          # to the .wxs files, and light binds from the working directory.
          light `
            -ext WixUtilExtension `
            -b installer `
            -cultures:en-US `
            -spdb `
            -sice:ICE60 `
            -out Vidra-Windows-x64.msi `
            installer\vidra.wixobj installer\files.wixobj installer\CustomUI.wixobj

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Light linking failed"
            exit $LASTEXITCODE
          }

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vidra-Windows-x64-MSI
          path: Vidra-Windows-x64.msi

  macos:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /Users/runner/hostedtoolcache/flutter
          key: flutter-macos-${{ runner.os }}-3.38.5
          restore-keys: flutter-macos-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            .packages
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: dart analyze

      - name: Test
        run: flutter test

      - name: Cache Build Output
        uses: actions/cache@v4
        with:
          path: build/macos/Build/Products/Release
          key: build-macos-${{ runner.os }}-${{ hashFiles('lib/**', 'macos/**', 'pubspec.yaml') }}
          restore-keys: build-macos-${{ runner.os }}-

      - name: Fetch vidraDlp native lib (libmedia_ffi.dylib)
        env:
          GH_TOKEN: ${{ secrets.VIDRADLP_TOKEN }}
        run: |
          set -e
          gh release download v0.0.1 -R heyvidra/VidraDlp \
            -p 'vidradlp-full-darwin-*.tar.gz' -O vidradlp.tar.gz
          mkdir -p _vidradlp && tar -xzf vidradlp.tar.gz -C _vidradlp
          cp "$(find _vidradlp -name libmedia_ffi.dylib | head -1)" macos/libmedia_ffi.dylib
          file macos/libmedia_ffi.dylib

      - name: Flutter Build (macOS Release)
        run: flutter build macos --release --split-debug-info=debug-info

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/create-dmg
          key: brew-${{ runner.os }}-create-dmg
          restore-keys: brew-${{ runner.os }}-

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          mkdir dmg
          cp -R build/macos/Build/Products/Release/Vidra.app dmg/
          create-dmg \
            --volname "Vidra" \
            --window-size 500 300 \
            --icon-size 100 \
            --app-drop-link 350 150 \
            Vidra-macOS-x64.dmg \
            dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vidra-macOS-x64-DMG
          path: Vidra-macOS-x64.dmg

  # ============ 🎉 创建 GitHub Release ============
  release:
    name: Create GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 下载所有构建产物
      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: Vidra-Windows-x64-MSI
          path: ./artifacts

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: Vidra-macOS-x64-DMG
          path: ./artifacts

      # 提取版本号
      - name: Get Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # 生成 Release Notes
      - name: Generate Release Notes
        id: notes
        run: |
          cat > release_notes.md << 'EOF'
          ## 🎉 Vidra ${{ steps.version.outputs.version }}

          ### 📦 Downloads

          | Platform | File |
          |---|---|
          | **Windows (64-bit)** | `Vidra-Windows-x64.msi` |
          | **macOS (64-bit)** | `Vidra-macOS-x64.dmg` |

          ### 🚀 What's New

          - Bug fixes and performance improvements

          ### 📝 Installation

          **Windows:**
          1. Download `Vidra-Windows-x64.msi`
          2. Double-click to install
          3. Follow the installation wizard

          **macOS:**
          1. Download `Vidra-macOS-x64.dmg`
          2. Open the DMG file
          3. Drag Vidra.app to Applications folder

          ### 🐛 Known Issues

          - None currently

          ### 💬 Feedback

          Please report issues on [GitHub Issues](https://github.com/${{ github.repository }}/issues)
          EOF

      # 创建 Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Vidra ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            ./artifacts/Vidra-Windows-x64.msi
            ./artifacts/Vidra-macOS-x64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
