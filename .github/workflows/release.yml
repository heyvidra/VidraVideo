name: Release

on:
  push:
    tags:
      - "v*"
  # Dry run: builds and uploads the artifacts, creates no GitHub Release.
  # GitHub only offers "Run workflow" for a definition on the default
  # branch, so this trigger has to live here even while the build it
  # exercises is on a feature branch.
  workflow_dispatch:
    inputs:
      version:
        description: "MSI ProductVersion to build with (x.y.z)"
        default: "0.0.0"

# One place for the toolchain version.
# Must match the SDK the app is developed and tested on. 1.11.0 shipped a
# macOS build whose desktop pet window stayed invisible (window created,
# alpha never restored) — built by CI on 3.44.4 while every dev test ran on
# 3.47.0. The same code built locally on 3.47.0 releases correctly.
#
# NO actions/cache STEPS IN THIS FILE, deliberately. This workflow runs on
# tag pushes, and a cache saved under one tag's ref is invisible to every
# other tag (restore scope = current ref + default branch). Each release
# therefore ran cold while dutifully saving ~4.5 GiB per platform it could
# never read back — duplicated once more by flutter-action's cache:true —
# churning the 10 GiB quota for zero hits. Removing them changes build time
# not at all; it merely stops pretending. If release time ever matters,
# warm caches from a job on main (that scope IS readable from tags), don't
# re-add caching here.
env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  windows:
    name: Windows MSI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: dart analyze

      - name: Test
        run: flutter test

      - name: Fetch vidraDlp native lib (media_ffi.dll)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VIDRADLP_TOKEN }}
        run: |
          set -e
          # Resolve the newest release rather than pinning. This was stuck on
          # v0.0.1 while the library shipped v0.4.3, so every build carried the
          # very first artifact ever cut — including, latterly, an FFI that
          # could not return rc=5 and took the app down on a parse panic.
          #
          # Unpinning trades reproducibility for freshness, so the resolved tag
          # is echoed and written to the step summary: an unpinned build must at
          # least be able to answer which library it contains.
          TAG="$(gh release view -R heyvidra/VidraDlp --json tagName -q .tagName)"
          echo "vidraDlp release: $TAG"
          echo "vidraDlp: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          gh release download "$TAG" -R heyvidra/VidraDlp \
            -p 'vidradlp-full-*_nt-*x86_64.tar.gz' -O vidradlp.tar.gz
          mkdir -p _vidradlp && tar -xzf vidradlp.tar.gz -C _vidradlp
          cp "$(find _vidradlp -name media_ffi.dll | head -1)" windows/media_ffi.dll
          ls -l windows/media_ffi.dll

      - name: Flutter Build (Windows Release)
        run: .\tool\build_windows.bat

      # `flutter build windows` reports "Unable to generate build files" and
      # swallows the CMake output that says WHY, so a configure failure arrives
      # as a sentence with no cause attached. These are the files that hold the
      # actual error; printing them on failure costs nothing and turns a
      # guessing game into a diagnosis.
      - name: CMake logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          $base = "build\windows\x64"
          foreach ($f in @("CMakeFiles\CMakeError.log",
                           "CMakeFiles\CMakeOutput.log",
                           "CMakeCache.txt")) {
            $p = Join-Path $base $f
            Write-Host "===== $p ====="
            if (Test-Path $p) { Get-Content $p -Tail 200 }
            else { Write-Host "(absent)" }
          }
          Write-Host "===== re-running configure verbosely ====="
          flutter build windows --release --verbose 2>&1 |
            Select-Object -Last 120

      # build_windows.bat appends pubspec_fonts.yaml to pubspec.yaml and strips
      # it again afterwards, so nothing downstream can tell whether the fonts
      # actually made it in. Without them Windows has no bundled CJK face and
      # every Chinese glyph falls back — check rather than ship that.
      - name: Verify bundled fonts
        shell: pwsh
        run: |
          $fonts = "build\windows\x64\runner\Release\data\flutter_assets\assets\fonts"
          $expected = (Select-String -Path pubspec_fonts.yaml -Pattern 'asset:').Count
          $found = @(Get-ChildItem -Path $fonts -Recurse -Filter *.ttf -ErrorAction SilentlyContinue)
          Write-Host "Bundled $($found.Count) of $expected font files"
          if ($found.Count -ne $expected) {
            Get-ChildItem -Path "build\windows\x64\runner\Release\data\flutter_assets" -ErrorAction SilentlyContinue
            throw "pubspec_fonts.yaml was not applied: expected $expected .ttf files under $fonts"
          }
          $manifest = "build\windows\x64\runner\Release\data\flutter_assets\FontManifest.json"
          if (-not (Select-String -Path $manifest -Pattern 'HarmonyOSSans_SC' -Quiet)) {
            throw "FontManifest.json is missing the HarmonyOSSans_SC family"
          }

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Generate WiX files with heat
        shell: pwsh
        run: |
          cd installer
          heat dir ..\build\windows\x64\runner\Release `
            -platform x64 `
            -cg VidraFiles `
            -dr INSTALLFOLDER `
            -gg -srd -sfrag -sreg `
            -var var.SourceDir `
            -out files.wxs

      - name: Build MSI
        shell: pwsh
        run: |
          $sourceDir = Resolve-Path "build\windows\x64\runner\Release"

          # MajorUpgrade only replaces the installed build when ProductVersion
          # changes, so it has to come from the tag rather than a literal.
          $version = "${{ inputs.version || github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "'$version' is not a x.y.z version MSI can use"
          }
          Write-Host "Building MSI for version $version"

          # Ensure installer directory exists
          New-Item -ItemType Directory -Force -Path installer | Out-Null

          # Run candle
          candle `
            -dSourceDir="$sourceDir" `
            -dProductVersion="$version" `
            -arch x64 `
            -out installer\ `
            installer\vidra.wxs installer\files.wxs installer\CustomUI.wxs

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Candle compilation failed"
            exit $LASTEXITCODE
          }

          # Run light
          # -b installer: icon.ico / *.bmp / License.rtf are referenced relative
          # to the .wxs files, and light binds from the working directory.
          light `
            -ext WixUtilExtension `
            -b installer `
            -cultures:en-US `
            -spdb `
            -sice:ICE60 `
            -out Vidra-Windows-x64.msi `
            installer\vidra.wixobj installer\files.wixobj installer\CustomUI.wixobj

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Light linking failed"
            exit $LASTEXITCODE
          }

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vidra-Windows-x64-MSI
          path: Vidra-Windows-x64.msi
          # Only the release job downloads these, and it runs minutes
          # later; keeping them longer just eats the storage quota.
          retention-days: 7

  macos:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      # The dev machine builds with SwiftPM OFF (CocoaPods integration) —
      # `flutter config --list` there says enable-swift-package-manager:
      # false — so that is the only plugin-linking model any dev build or
      # test has ever exercised. Flutter defaults SwiftPM ON since 3.44,
      # so CI silently shipped a different binary shape: plugins in one
      # aggregate SwiftPM dylib, bitsdojo statically inside the main
      # executable. Those binaries lose the pet window's startup race that
      # CocoaPods-shaped binaries never lose (1.11.0-1.11.2 all invisible).
      # Match the tested configuration. Revisit when dev moves to SwiftPM.
      - name: Match dev plugin integration (CocoaPods, not SwiftPM)
        run: flutter config --no-enable-swift-package-manager

      - name: Get Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: dart analyze

      - name: Test
        run: flutter test

      - name: Fetch vidraDlp native lib (libmedia_ffi.dylib)
        env:
          GH_TOKEN: ${{ secrets.VIDRADLP_TOKEN }}
        run: |
          set -e
          # Newest release, not a pin — see the Windows job for why, and for
          # what the echoed tag is protecting against.
          TAG="$(gh release view -R heyvidra/VidraDlp --json tagName -q .tagName)"
          echo "vidraDlp release: $TAG"
          echo "vidraDlp: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          gh release download "$TAG" -R heyvidra/VidraDlp \
            -p 'vidradlp-full-darwin-*.tar.gz' -O vidradlp.tar.gz
          mkdir -p _vidradlp && tar -xzf vidradlp.tar.gz -C _vidradlp
          cp "$(find _vidradlp -name libmedia_ffi.dylib | head -1)" macos/libmedia_ffi.dylib
          file macos/libmedia_ffi.dylib

      - name: Flutter Build (macOS Release)
        # The DSN lives in repo secrets, never in the tree: a build without one
        # reports nothing at all, which is what every fork and local build
        # should do. --split-debug-info means the traces that DO arrive carry
        # addresses, so the symbol upload below is what makes them readable.
        run: |
          flutter build macos --release --split-debug-info=debug-info \
            --dart-define=SENTRY_DSN="${SENTRY_DSN}"
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Upload debug symbols to Sentry
        # Skipped rather than failed when the token is absent: a fork building
        # this tag must still get a DMG. The `secrets` context is NOT readable
        # from a step-level `if:` — GitHub silently evaluates it to empty, so
        # the condition would be false forever and this step would never run.
        # Hoisting it into `env` at the step is what makes it visible.
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        run: dart run sentry_dart_plugin
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Install create-dmg
        run: brew install create-dmg

      # One universal build, split into two downloads.
      #
      # Flutter builds macOS universal, so every user was downloading a
      # complete copy of the architecture their Mac cannot run: 96 MB
      # installed, 61 MB once thinned. Thinning here rather than building
      # twice keeps one compile and one symbol upload, and the two bundles
      # are byte-identical to the slices that were tested together.
      #
      # Re-signing is not optional. The bundle is ad-hoc signed, lipo
      # invalidates that, and macOS refuses to launch an unsigned arm64
      # binary at all — the failure is a crash on open, not a warning.
      - name: Create DMGs (per architecture)
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            slice=$arch
            [ "$arch" = "x64" ] && slice=x86_64
            rm -rf "dmg-$arch" && mkdir "dmg-$arch"
            cp -R build/macos/Build/Products/Release/Vidra.app "dmg-$arch/"
            app="dmg-$arch/Vidra.app"
            # Every Mach-O, not just the executables: the frameworks are
            # where the weight is, and a .dylib is not marked executable.
            find "$app" -type f | while read -r f; do
              if lipo -info "$f" 2>/dev/null | grep -q '^Architectures in the fat file'; then
                lipo -thin "$slice" "$f" -output "$f.thin" && mv "$f.thin" "$f"
              fi
            done
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            echo "$arch: $(du -sh "$app" | cut -f1)"
            create-dmg \
              --volname "Vidra" \
              --window-size 500 300 \
              --icon-size 100 \
              --app-drop-link 350 150 \
              "Vidra-macOS-$arch.dmg" \
              "dmg-$arch"
          done

      - name: Upload DMG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vidra-macOS-DMG
          path: Vidra-macOS-*.dmg
          # Only the release job downloads these, and it runs minutes
          # later; keeping them longer just eats the storage quota.
          retention-days: 7

  # ============ 🎉 创建 GitHub Release ============
  release:
    name: Create GitHub Release
    needs: [windows, macos]
    # A manual run is a dry run: the artifacts are worth having, a Release is not.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 下载所有构建产物
      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: Vidra-Windows-x64-MSI
          path: ./artifacts

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: Vidra-macOS-DMG
          path: ./artifacts

      # 提取版本号
      - name: Get Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # 生成 Release Notes
      - name: Generate Release Notes
        id: notes
        run: |
          cat > release_notes.md << 'EOF'
          ## 🎉 Vidra ${{ steps.version.outputs.version }}

          ### 📦 Downloads

          | Platform | File |
          |---|---|
          | **Windows (64-bit)** | `Vidra-Windows-x64.msi` |
          | **macOS — Apple 芯片 (M1/M2/M3/M4)** | `Vidra-macOS-arm64.dmg` |
          | **macOS — Intel 芯片** | `Vidra-macOS-x64.dmg` |

          ### 🚀 What's New

          - Bug fixes and performance improvements

          ### 📝 Installation

          **Windows:**
          1. Download `Vidra-Windows-x64.msi`
          2. Double-click to install
          3. Follow the installation wizard

          **macOS:** 先看左上角  → 关于本机。写着 Apple M 系列就选 `arm64`,
          写着 Intel 就选 `x64`。
          1. Download the DMG for your chip
          2. Open the DMG file
          3. Drag Vidra.app to Applications folder

          拿错了不会损坏任何东西: Intel 机器打开 arm64 版会直接报"不支持",
          Apple 芯片打开 x64 版能跑但走 Rosetta 转译,会明显更慢。

          ### 🐛 Known Issues

          - None currently

          ### 💬 Feedback

          Please report issues on [GitHub Issues](https://github.com/${{ github.repository }}/issues)
          EOF

      # 创建 Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Vidra ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            ./artifacts/Vidra-Windows-x64.msi
            ./artifacts/Vidra-macOS-arm64.dmg
            ./artifacts/Vidra-macOS-x64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
